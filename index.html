<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoxStudio — демо</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#171411;color:#e9e2da}body{display:flex;flex-direction:column}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:#211d19;border-bottom:1px solid #ff642f55;flex-shrink:0;font-size:14px}button{cursor:pointer;border:1px solid #ff642f88;background:transparent;color:#ff895f;border-radius:10px;padding:11px 15px;font:inherit}button:focus-visible{outline:2px solid white;outline-offset:2px}iframe{border:0;width:100%;flex:1;min-height:0;background:#eeeafa}.closed{margin:auto;text-align:center;padding:24px}.closed[hidden]{display:none}h1{font-size:24px}p{color:#c9c1b7;line-height:1.5}</style></head>
<body><header class="bar"><span>FoxStudio · демо</span><button id="exit" type="button">✕ Выйти из демо</button></header>
<iframe id="demo" title="Приложение FoxStudio" allow="clipboard-write; fullscreen" allowfullscreen></iframe>
<main class="closed" id="closed" hidden><h1>Демо закрыто</h1><p>Спасибо, что попробовали FoxStudio.</p><button id="again" type="button">Открыть снова</button></main>
<script>
const frame=document.getElementById('demo');
function openDemo(){document.getElementById('closed').hidden=true;frame.style.display='block';frame.src="./app.html";document.getElementById('exit').hidden=false;}
function closeDemo(){frame.src='about:blank';frame.style.display='none';document.getElementById('closed').hidden=false;document.getElementById('exit').hidden=true;document.getElementById('again').focus();if(window.parent!==window)window.parent.postMessage({type:'foxstudio-demo:close'},'*');}
document.getElementById('exit').addEventListener('click',closeDemo);document.getElementById('again').addEventListener('click',openDemo);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDemo();});openDemo();
</script></body></html>
